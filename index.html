<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Practice — EduCourse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e4e2dc;
    --accent:#2f5bea; --accent-soft:#e8eeff; --ok:#1f8a4c; --ok-soft:#e5f5ec; --bad:#c2372f; --bad-soft:#fbe9e7; --warn:#a86a00;
    --c1:#7a4fd6; --c2:#1f8a7a; --c3:#c77a12; --c4:#2f5bea; --c5:#c2378a; --c6:#2e7d32; --c7:#b5452b; --c8:#4a6b8a;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#161618; --card:#1f1f22; --ink:#f1f1f3; --muted:#a0a0a8; --line:#333338;
      --accent:#7d9bff; --accent-soft:#232c4a; --ok:#4cc584; --ok-soft:#173326; --bad:#ff7b72; --bad-soft:#3a1d1b; --warn:#f0b04f;
      --c1:#b392ff; --c2:#4fd1bd; --c3:#f0b04f; --c4:#7d9bff; --c5:#ff8fcf; --c6:#7bd88f; --c7:#ff9a7a; --c8:#9ec3e6; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:660px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 24px;font-size:.95rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
  .crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:.88rem}
  .link{background:none;border:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:0}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:.85rem;color:var(--muted)}
  .bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar>div{height:100%;background:var(--accent);width:0;transition:width .3s}
  .tag{display:inline-block;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:99px;border:1px solid currentColor}
  .k1{color:var(--c1)} .k2{color:var(--c2)} .k3{color:var(--c3)} .k4{color:var(--c4)} .k5{color:var(--c5)} .k6{color:var(--c6)} .k7{color:var(--c7)} .k8{color:var(--c8)}
  .q{font-size:1.15rem;font-weight:600;margin:14px 0 6px}
  .hint{color:var(--muted);font-size:.9rem;margin:0 0 16px}
  .big{font-size:1.9rem;font-weight:700;text-align:center;margin:10px 0 18px;line-height:1.35}
  .big.sentence{font-size:1.25rem;font-weight:600}
  .big .blank{display:inline-block;min-width:70px;border-bottom:2.5px solid var(--accent);margin:0 4px}
  .approx{font-size:1.15rem;text-align:center;background:var(--accent-soft);border-radius:10px;padding:10px;margin:6px 0 16px;letter-spacing:.03em}
  .listen{display:flex;justify-content:center;margin:4px 0 12px}
  input[type=text]{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);outline:none}
  input[type=text]:focus{border-color:var(--accent)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{font:inherit;font-size:1.02rem;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:center}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .btn{font:inherit;font-weight:600;padding:12px 18px;border:none;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .fb{margin-top:16px;padding:14px;border-radius:10px;font-size:.95rem;display:none}
  .fb.ok{display:block;background:var(--ok-soft);color:var(--ok)}
  .fb.bad{display:block;background:var(--bad-soft);color:var(--bad)}
  .fb b{color:var(--ink)}
  .fb .why{color:var(--ink);margin-top:6px;opacity:.85}
  .fb .warn{color:var(--warn);margin-top:6px;font-weight:600}
  .score{font-size:3rem;font-weight:700;text-align:center;margin:8px 0 0}
  .center{text-align:center}
  .weeks{display:grid;gap:12px}
  .week{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px 20px;cursor:pointer}
  .week:hover{border-color:var(--accent)}
  .week h2{font-size:1.1rem;margin:0 0 2px}
  .week p{margin:0;color:var(--muted);font-size:.9rem}
  .week .count{font-size:.85rem;color:var(--accent);font-weight:600;white-space:nowrap}
  .cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:18px 0}
  .cat{border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:.8rem;color:var(--muted);background:var(--bg);font-family:inherit}
  .cat strong{display:block;font-size:1.1rem;color:var(--ink)}
  button.cat{cursor:pointer}
  button.cat.on{border-color:var(--accent);background:var(--accent-soft)}
  button.cat.off{opacity:.45}
  .review{margin-top:18px}
  .review h3{font-size:1rem;margin:0 0 10px}
  .rv{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}
  .rv .yours{color:var(--bad)} .rv .right{color:var(--ok);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>English Practice</h1>
  <p class="sub">Cuestionarios de repaso del curso de inglés en EduCourse.</p>
  <div id="app"></div>
</div>

<script>
// =====================================================================
// SEMANAS Y TEMAS
// =====================================================================
const WEEKS = [
  { id:1, title:'Semana 1', desc:'Alfabeto y deletreo, puntuación, números y lugares',
    cats:{ num:'Números', place:'Lugares', punct:'Puntuación', spell:'Deletreo' } },
  { id:2, title:'Semana 2', desc:'Días, meses, pronombres, will, Wh- questions, daily routine, artículos y transition words',
    cats:{ days:'Días', months:'Meses', pron:'Pronombres', will:'Will', wh:'Wh- questions', routine:'Daily routine', art:'A / An / The', trans:'Transition words' } },
  { id:3, title:'Semana 3', desc:'Estaciones y clima, preposiciones (in, on, at), frutas, vegetales y transition words',
    cats:{ weather:'Seasons & weather', pplace:'Prepositions of place', ptime:'Prepositions of time', fruits:'Fruits', veggies:'Vegetables', trans3:'Transition words' } },
];

// =====================================================================
// BANCO DE PREGUNTAS
// type: 'text' (escribir) | 'mc' (opción múltiple) | 'listen' (escuchar deletreo y escribir)
// pron: compara como pronunciación · noAnd: ignora "and" (números) · cap: recordar mayúscula
// =====================================================================
const BANK = [
// NÚMEROS (9)
  {week:1, cat:'num', noAnd:true, type:'text', q:'Escribe el número en inglés', big:'13', a:['thirteen'], why:'13 = thir-TEEN (acento al final). No lo confundas con 30 = THIR-ty.'},
  {week:1, cat:'num', noAnd:true, type:'text', q:'Escribe el número en inglés', big:'40', a:['forty'], why:'Se escribe forty, sin "u" (no "fourty"), aunque four sí la lleva.'},
  {week:1, cat:'num', noAnd:true, type:'text', q:'Escribe el número en inglés', big:'47', a:['forty seven'], why:'Del 21 al 99 se usa guion: forty-seven.'},
  {week:1, cat:'num', noAnd:true, type:'text', q:'Escribe el número en inglés', big:'118', a:['one hundred eighteen','a hundred eighteen'], why:'one hundred (and) eighteen. "Hundred" no lleva "s".'},
  {week:1, cat:'num', noAnd:true, type:'text', q:'Escribe el número en inglés', big:'365', a:['three hundred sixty five'], why:'three hundred (and) sixty-five.'},
  {week:1, cat:'num', noAnd:true, type:'text', q:'Escribe el número en inglés', big:'1,500', a:['one thousand five hundred','fifteen hundred','a thousand five hundred'], why:'one thousand five hundred, o también fifteen hundred.'},
  {week:1, cat:'num', noAnd:true, type:'text', q:'Escribe el número en inglés', big:'75,000', a:['seventy five thousand'], why:'seventy-five thousand. "Thousand" no lleva "s".'},
  {week:1, cat:'num', noAnd:true, type:'text', q:'Escribe el número en inglés', big:'300,000', a:['three hundred thousand'], why:'three hundred thousand.'},
  {week:1, cat:'num', noAnd:true, type:'text', q:'Escribe el número en inglés', big:'4,000,000', a:['four million'], why:'four million — sin "s" (no "four millions").'},

  // LUGARES (8)
  {week:1, cat:'place', type:'text', q:'¿Cómo se dice en inglés?', big:'Museo', a:['museum','a museum','the museum'], why:'Museum (miu-SÍ-om).'},
  {week:1, cat:'place', type:'text', q:'¿Cómo se dice en inglés?', big:'Alcaldía', a:['city hall','town hall'], why:'City Hall.'},
  {week:1, cat:'place', type:'text', q:'¿Cómo se dice en inglés?', big:'Embajada', a:['embassy','an embassy','the embassy'], why:'Embassy — con doble S.'},
  {week:1, cat:'place', type:'text', q:'¿Cómo se dice en inglés?', big:'Fábrica', a:['factory','a factory','the factory'], why:'Factory.'},
  {week:1, cat:'place', type:'text', q:'¿Cómo se dice en inglés?', big:'Puente', a:['bridge','a bridge','the bridge'], why:'Bridge.'},
  {week:1, cat:'place', type:'text', q:'¿Cómo se dice en inglés?', big:'Parque de diversiones', a:['amusement park','an amusement park','the amusement park'], why:'Amusement park.'},
  {week:1, cat:'place', type:'text', q:'¿Cómo se dice en inglés?', big:'Isla', a:['island','an island','the island'], why:'Island — la "s" no se pronuncia: ÁI-land.'},
  {week:1, cat:'place', type:'text', q:'¿Cómo se dice en inglés?', big:'Bosque', a:['forest','a forest','the forest'], why:'Forest.'},

  // PUNTUACIÓN (10)
  {week:1, cat:'punct', type:'text', q:'¿Cómo se llama este signo en inglés?', big:'_', a:['underscore'], why:'_ = underscore (ánderskor).'},
  {week:1, cat:'punct', type:'text', q:'¿Cómo se llama este signo en inglés?', big:'-', a:['hyphen','dash'], why:'- = hyphen (jáifen). "Dash" es una raya más larga (—), pero se acepta.'},
  {week:1, cat:'punct', type:'text', q:'¿Cómo se llama este signo en inglés?', big:';', a:['semicolon','semi colon'], why:'; = semicolon (sémi-cóulon).'},
  {week:1, cat:'punct', type:'text', q:'¿Cómo se llama este signo en inglés?', big:'@', a:['at','at sign'], why:'@ = at.'},
  {week:1, cat:'punct', type:'text', q:'¿Cómo se llama este signo en inglés?', big:'?', a:['question mark'], why:'? = question mark (kuéschon mark).'},
  {week:1, cat:'punct', type:'mc', q:'¿Cuál signo es un "colon"?', opts:[':',';',',','.'], a:':', why:'Colon = dos puntos ( : ). Semicolon = punto y coma ( ; ).'},
  {week:1, cat:'punct', type:'mc', q:'¿Cuál signo es una "comma"?', opts:[',','.',';','\''], a:',', why:'Comma = coma ( , ).'},
  {week:1, cat:'punct', type:'mc', q:'En el correo jorge.romero@mail.com, ¿cómo se lee el "."?', opts:['dot','point','period','full stop'], a:'dot', why:'En correos y páginas web el punto se lee "dot".'},
  {week:1, cat:'punct', type:'mc', q:'3.5 se lee "three ___ five"', opts:['point','dot','period','comma'], a:'point', why:'En decimales el punto se lee "point".'},
  {week:1, cat:'punct', type:'mc', q:'¿Qué significan "parentheses"?', opts:['( )','" "','/ /','# #'], a:'( )', why:'Parentheses = paréntesis ( ). " " = quotation marks.'},

  // DELETREO Y VOCALES (13)
  {week:1, cat:'spell', type:'mc', q:'¿Qué letra se pronuncia "ái"?', opts:['I','E','A','Y'], a:'I', why:'I = /aɪ/ "ái". Ojo: Y = "uái".'},
  {week:1, cat:'spell', type:'mc', q:'¿Qué letra se pronuncia "i"?', opts:['E','I','Y','A'], a:'E', why:'E = /iː/ "i". Es la que más se confunde con nuestra I.'},
  {week:1, cat:'spell', type:'mc', q:'¿Qué letra se pronuncia "éi"?', opts:['A','E','I','H'], a:'A', why:'A = /eɪ/ "éi". H = "éich".'},
  {week:1, cat:'spell', type:'mc', q:'¿Qué letra se pronuncia "óu"?', opts:['O','U','W','A'], a:'O', why:'O = /oʊ/ "óu".'},
  {week:1, cat:'spell', type:'mc', q:'¿Qué letra se pronuncia "iú"?', opts:['U','Q','W','O'], a:'U', why:'U = /juː/ "iú". Q = "kiú", W = "dábel-iu".'},
  {week:1, cat:'spell', type:'mc', q:'¿Qué letra se pronuncia "yéi"?', opts:['J','G','Y','H'], a:'J', why:'J = "yéi", G = "yi". Son al revés que en español.'},
  {week:1, cat:'spell', type:'text', q:'Escribe la pronunciación aproximada de esta letra', big:'I', a:['ai','ay','aai'], why:'I se dice "ái" /aɪ/.', pron:true},
  {week:1, cat:'spell', type:'text', q:'Escribe la pronunciación aproximada de esta letra', big:'E', a:['i','ii','ee'], why:'E se dice "i" /iː/.', pron:true},
  {week:1, cat:'spell', type:'text', q:'Escribe la pronunciación aproximada de esta letra', big:'A', a:['ei','ey','eei'], why:'A se dice "éi" /eɪ/.', pron:true},
  {week:1, cat:'spell', type:'text', q:'Escribe la pronunciación aproximada de esta letra', big:'U', a:['iu','yu','you','iuu','yuu'], why:'U se dice "iú" /juː/.', pron:true},
  {week:1, cat:'spell', type:'listen', q:'Escucha (o lee) el deletreo y escribe la palabra', word:'BRIDGE', a:['bridge'], why:'bi · ar · ái · di · yi · i = BRIDGE (puente).'},
  {week:1, cat:'spell', type:'listen', q:'Escucha (o lee) el deletreo y escribe la palabra', word:'EMBASSY', a:['embassy'], why:'i · em · bi · éi · double es · uái = EMBASSY (embajada).'},
  {week:1, cat:'spell', type:'listen', q:'Escucha (o lee) el deletreo y escribe la palabra', word:'ISLAND', a:['island'], why:'ái · es · el · éi · en · di = ISLAND (isla).'},
// ---------- MONDAY · DAYS OF THE WEEK ----------
  {week:2, day:'Monday', cat:'days', type:'text', q:'Escribe el día en inglés', big:'Martes', a:['Tuesday'], cap:true, why:'Tuesday: T-U-E-S-D-A-Y. Lleva "ue" después de la T.'},
  {week:2, day:'Monday', cat:'days', type:'text', q:'Escribe el día en inglés', big:'Miércoles', a:['Wednesday'], cap:true, why:'Wednesday: W-E-D-N-E-S-D-A-Y. La "d" después de "We" se escribe, aunque no se pronuncia.'},
  {week:2, day:'Monday', cat:'days', type:'text', q:'Escribe el día en inglés', big:'Jueves', a:['Thursday'], cap:true, why:'Thursday: T-H-U-R-S-D-A-Y. Empieza con "Thu".'},
  {week:2, day:'Monday', cat:'days', type:'mc', q:'¿Cuál está bien escrito?', opts:['Wednesday','Wensday','Wednsday','Wedensday'], a:'Wednesday', why:'Wed + nes + day = Wednesday.'},
  {week:2, day:'Monday', cat:'days', type:'mc', q:'¿Cuál está bien escrito?', opts:['Tuesday','Tusday','Teusday','Tuseday'], a:'Tuesday', why:'Tue + s + day = Tuesday ("ue", no "eu").'},
  {week:2, day:'Monday', cat:'days', type:'mc', q:'¿Cuál está bien escrito?', opts:['Thursday','Thrusday','Thurday','Thusrday'], a:'Thursday', why:'Thurs + day = Thursday. Primero "u" y luego "r".'},
  {week:2, day:'Monday', cat:'days', type:'mc', q:'¿Qué significa "Thursday"?', opts:['Jueves','Martes','Miércoles','Viernes'], a:'Jueves', why:'Thursday = jueves. Tuesday = martes: los dos empiezan con T, ¡no los confundas!'},
  {week:2, day:'Monday', cat:'days', type:'mc', q:'¿Qué significa "Tuesday"?', opts:['Martes','Jueves','Miércoles','Lunes'], a:'Martes', why:'Tuesday = martes.'},
  {week:2, day:'Monday', cat:'days', type:'mc', q:'¿Qué significa "Wednesday"?', opts:['Miércoles','Martes','Jueves','Sábado'], a:'Miércoles', why:'Wednesday = miércoles.'},
  {week:2, day:'Monday', cat:'days', type:'text', q:'Escribe el día completo de esta abreviatura', big:'Wed', a:['Wednesday'], cap:true, why:'Wed = Wednesday.'},
  {week:2, day:'Monday', cat:'days', type:'text', q:'Escribe el día completo de esta abreviatura', big:'Thu', a:['Thursday'], cap:true, why:'Thu = Thursday.'},
  {week:2, day:'Monday', cat:'days', type:'text', q:'Escribe el día completo de esta abreviatura', big:'Tue', a:['Tuesday'], cap:true, why:'Tue = Tuesday.'},
  {week:2, day:'Monday', cat:'days', type:'text', q:'Completa', big:'The day after Tuesday is <span class="blank"></span>', sentence:true, a:['Wednesday'], cap:true, why:'Después del martes viene el miércoles: Wednesday.'},
  {week:2, day:'Monday', cat:'days', type:'text', q:'Completa', big:'The day before Friday is <span class="blank"></span>', sentence:true, a:['Thursday'], cap:true, why:'Antes del viernes viene el jueves: Thursday.'},
  {week:2, day:'Monday', cat:'days', type:'text', q:'Completa', big:'The day between Monday and Wednesday is <span class="blank"></span>', sentence:true, a:['Tuesday'], cap:true, why:'Entre lunes y miércoles está el martes: Tuesday.'},

  // ---------- MONDAY · MONTHS (los más difíciles de escribir) ----------
  {week:2, day:'Monday', cat:'months', type:'text', q:'Escribe el mes en inglés', big:'Febrero', a:['February'], cap:true, why:'February: F-E-B-R-U-A-R-Y. Tiene una "r" después de "Feb", que muchos olvidan.'},
  {week:2, day:'Monday', cat:'months', type:'text', q:'Escribe el mes en inglés', big:'Enero', a:['January'], cap:true, why:'January: J-A-N-U-A-R-Y.'},
  {week:2, day:'Monday', cat:'months', type:'text', q:'Escribe el mes en inglés', big:'Agosto', a:['August'], cap:true, why:'August: A-U-G-U-S-T. Empieza con "Au", no con "Ag".'},
  {week:2, day:'Monday', cat:'months', type:'text', q:'Escribe el mes en inglés', big:'Septiembre', a:['September'], cap:true, why:'September: sin "i" (no "Septiember") y termina en "-ber".'},
  {week:2, day:'Monday', cat:'months', type:'text', q:'Escribe el mes en inglés', big:'Octubre', a:['October'], cap:true, why:'October: con "o" (Octo-), no "Octuber".'},
  {week:2, day:'Monday', cat:'months', type:'text', q:'Escribe el mes en inglés', big:'Diciembre', a:['December'], cap:true, why:'December: con "c", no con "s".'},
  {week:2, day:'Monday', cat:'months', type:'mc', q:'¿Cuál está bien escrito?', opts:['February','Febuary','Febrary','Febraury'], a:'February', why:'Feb-RU-ary: después de "Feb" va "ru".'},
  {week:2, day:'Monday', cat:'months', type:'mc', q:'¿Cuál está bien escrito?', opts:['August','Agust','Augost','Agoust'], a:'August', why:'Aug-ust.'},
  {week:2, day:'Monday', cat:'months', type:'mc', q:'¿Cuál está bien escrito?', opts:['September','Septiember','Setember','Septembre'], a:'September', why:'Sep-tem-ber.'},
  {week:2, day:'Monday', cat:'months', type:'mc', q:'¿Qué significa "June"?', opts:['Junio','Julio','Enero','Junio y julio'], a:'Junio', why:'June = junio · July = julio.'},
  {week:2, day:'Monday', cat:'months', type:'text', q:'Completa', big:'The month after July is <span class="blank"></span>', sentence:true, a:['August'], cap:true, why:'Después de julio viene agosto: August.'},

  // ---------- MONDAY · PRONOUNS (los más confusos) ----------
  {week:2, day:'Monday', cat:'pron', type:'mc', q:'Completa la oración', big:'The dog is wagging <span class="blank"></span> tail.', sentence:true, opts:['its',"it's",'it','his'], a:'its', why:'its = su (posesivo). it\'s = it is. Aquí es "su cola", así que va its.'},
  {week:2, day:'Monday', cat:'pron', type:'mc', q:'Completa la oración', big:'<span class="blank"></span> raining today.', sentence:true, opts:["It's",'Its','It','Is'], a:"It's", why:'It\'s = It is. "It is raining" (está lloviendo). En inglés el sujeto no se omite.'},
  {week:2, day:'Monday', cat:'pron', type:'mc', q:'Completa la oración', big:'<span class="blank"></span> house is very big.', sentence:true, opts:['Their','There',"They're",'Them'], a:'Their', why:'Their = su (de ellos). Su casa.'},
  {week:2, day:'Monday', cat:'pron', type:'mc', q:'Completa la oración', big:'<span class="blank"></span> coming on Thursday.', sentence:true, opts:["They're",'Their','There','They'], a:"They're", why:'They\'re = They are. "They are coming" (vienen).'},
  {week:2, day:'Monday', cat:'pron', type:'mc', q:'Completa la oración', big:'Your phone is over <span class="blank"></span>.', sentence:true, opts:['there','their',"they're",'them'], a:'there', why:'there = allí.'},
  {week:2, day:'Monday', cat:'pron', type:'mc', q:'Completa la oración', big:'Maria lost <span class="blank"></span> keys.', sentence:true, opts:['her','his','she','hers'], a:'her', why:'Maria es mujer → her (su). His es "su" de un hombre.'},

// ---------- Deletreo ----------
const APPROX = {A:'éi',B:'bi',C:'si',D:'di',E:'i',F:'ef',G:'yi',H:'éich',I:'ái',J:'yéi',K:'kéi',L:'el',M:'em',N:'en',O:'óu',P:'pi',Q:'kiú',R:'ar',S:'es',T:'ti',U:'iú',V:'vi',W:'dábel-iu',X:'eks',Y:'uái',Z:'zi'};
function groupLetters(word, f){
  const out=[], w=word.toUpperCase();
  for(let i=0;i<w.length;i++){ if(w[i+1]===w[i]){ out.push('double '+f(w[i])); i++; } else out.push(f(w[i])); }
  return out;
}
const spellApprox = w => groupLetters(w, l=>APPROX[l]).join(' · ');
const spellSpeech = w => groupLetters(w, l=>l).join(', ');
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return false;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.7;
    const v = speechSynthesis.getVoices().find(v=>v.lang && v.lang.startsWith('en')); if(v) u.voice=v;
    speechSynthesis.speak(u); return true;
  }catch(e){ return false; }
}

// ---------- Utilidades ----------
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s, it){
  s = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’‘]/g,"'");
  if(it.pron) return s.replace(/[\/ː:\s.\-'"]/g,'');
  s = s.replace(/\bwon't\b/g,'will not').replace(/\bwont\b/g,'will not')
       .replace(/\b(i|you|he|she|it|we|they)'ll\b/g,'$1 will');
  s = s.replace(/[-–—]/g,' ').replace(/[?.!,¿¡"]/g,' ');
  if(it.noAnd) s = s.replace(/\band\b/g,' ');
  return s.replace(/\s+/g,' ').trim();
}
function correctText(it){
  if(it.type==='mc') return it.a;
  if(it.type==='listen') return it.word.toLowerCase();
  let a = it.a[0];
  if(it.cat==='num') return a.replace(/\b(twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety) (one|two|three|four|five|six|seven|eight|nine)\b/g,'$1-$2');
  if(it.cat==='will'||(it.cat==='wh'&&it.sentence)) a += /^(will|when|where|what|who|why|how|which|whose)\b/i.test(a)?'?':'.';
  return a;
}
const plain = s => String(s).replace(/<span class="blank"><\/span>/g,'___').replace(/<[^>]+>/g,'');

// ---------- Estado ----------
let week=null, selected=new Set(), quiz=[], idx=0, results=[], answered=false;
const app = document.getElementById('app');
const weekQs = w => BANK.filter(q=>q.week===w.id);
const catColor = (w,c) => 'k'+(Object.keys(w.cats).indexOf(c)+1);

function home(){
  week=null;
  app.innerHTML = `<div class="weeks">${WEEKS.map(w=>`
    <button class="week" data-w="${w.id}">
      <div><h2>${esc(w.title)}</h2><p>${esc(w.desc)}</p></div>
      <span class="count">${weekQs(w).length} preguntas →</span>
    </button>`).join('')}</div>`;
  app.querySelectorAll('.week').forEach(b=>b.onclick=()=>{
    week = WEEKS.find(w=>w.id==b.dataset.w);
    selected = new Set(Object.keys(week.cats));
    topics();
  });
}

function topics(){
  const qs = weekQs(week);
  const total = qs.filter(q=>selected.has(q.cat)).length;
  app.innerHTML = `
    <div class="card">
      <div class="crumb"><button class="link" id="back">← Semanas</button><span class="hint" style="margin:0">/ ${esc(week.title)}</span></div>
      <p class="q" style="margin-top:0">¿Qué quieres practicar?</p>
      <p class="hint">Toca un tema para incluirlo o quitarlo. Las preguntas salen en orden aleatorio cada vez.</p>
      <div class="cats">
        ${Object.entries(week.cats).map(([c,name])=>`<button class="cat ${selected.has(c)?'on':'off'}" data-c="${c}"><strong>${qs.filter(q=>q.cat===c).length}</strong>${esc(name)}</button>`).join('')}
      </div>
      <p class="hint">No importan las mayúsculas, los acentos, los guiones ni el signo de interrogación. En <i>will</i> puedes usar la forma completa o la contracción (<i>won't</i>, <i>I'll</i>).</p>
      <div class="row"><button class="btn" id="go" ${total?'':'disabled'}>Empezar (${total} preguntas)</button></div>
    </div>`;
  app.querySelectorAll('button.cat').forEach(b=>b.onclick=()=>{ const c=b.dataset.c; selected.has(c)?selected.delete(c):selected.add(c); topics(); });
  document.getElementById('back').onclick = home;
  document.getElementById('go').onclick = ()=>{ quiz = shuffle(qs.filter(q=>selected.has(q.cat))); idx=0; results=[]; render(); };
}

function render(){
  answered=false;
  const it = quiz[idx];
  const pct = (idx/quiz.length)*100;
  let body = it.big ? `<div class="big ${it.sentence?'sentence':''}">${it.big.includes('<span')?it.big:esc(it.big)}</div>` : '';
  if(it.sub) body += `<div class="approx">🔊 ${esc(it.sub)}</div>`;
  if(it.type==='listen'){
    body += `<div class="listen"><button class="btn ghost" id="play">🔊 Escuchar deletreo</button></div>
      <div class="approx">${esc(spellApprox(it.word))}</div>
      <input type="text" id="ans" placeholder="Escribe la palabra…" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  } else if(it.type==='text'){
    body += `<input type="text" id="ans" placeholder="${it.pron?'Ej.: como suena en español…':'Escribe tu respuesta…'}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
  } else {
    body += `<div class="opts">${shuffle(it.opts).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  }
  app.innerHTML = `
    <div class="card">
      <div class="crumb"><button class="link" id="quit">← Salir</button><span class="hint" style="margin:0">/ ${esc(week.title)}</span></div>
      <div class="top"><span class="tag ${catColor(week,it.cat)}">${esc(week.cats[it.cat])}</span><span>${idx+1} / ${quiz.length}</span></div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <p class="q">${esc(it.q)}</p>
      ${body}
      <div class="fb" id="fb"></div>
      <div class="row">
        ${it.type!=='mc'?'<button class="btn" id="check">Revisar</button>':''}
        <button class="btn" id="next" style="display:none">${idx===quiz.length-1?'Ver resultado':'Siguiente →'}</button>
      </div>
    </div>`;
  document.getElementById('quit').onclick = topics;
  if(it.type==='mc'){
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(answered) return;
      const ok = b.dataset.v===it.a;
      app.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; if(x.dataset.v===it.a) x.classList.add('correct'); });
      if(!ok) b.classList.add('wrong');
      finish(ok, b.dataset.v);
    });
  } else {
    const inp = document.getElementById('ans');
    inp.focus();
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ answered ? next() : check(); }});
    document.getElementById('check').onclick = check;
    if(it.type==='listen') document.getElementById('play').onclick = ()=>{
      if(!speak(spellSpeech(it.word))) document.getElementById('play').textContent='Audio no disponible: usa la guía';
    };
  }
  document.getElementById('next').onclick = next;
}

function check(){
  if(answered) return;
  const it = quiz[idx];
  const inp = document.getElementById('ans');
  const raw = inp.value;
  if(!raw.trim()){ inp.focus(); return; }
  const ok = it.a.some(a=>norm(a,it)===norm(raw,it));
  inp.disabled = true;
  document.getElementById('check').style.display='none';
  finish(ok, raw);
}

function finish(ok, given){
  answered=true;
  const it = quiz[idx];
  results.push({it, ok, given});
  let warn = '';
  const g = String(given).trim();
  if(ok && it.cap && g && g[0]!==g[0].toUpperCase())
    warn = `<div class="warn">⚠ Recuerda: días y meses van con mayúscula → ${esc(it.a[0])}</div>`;
  const fb = document.getElementById('fb');
  fb.className = 'fb ' + (ok?'ok':'bad');
  const pron = it.pr ? `<div class="why">🔊 Pronunciación: <b>${esc(it.pr)}</b> <button class="link" id="say">Escuchar</button></div>` : '';
  fb.innerHTML = ok
    ? `✔ ¡Correcto!${warn}<div class="why">${esc(it.why)}</div>${pron}`
    : `✘ Respuesta correcta: <b>${esc(correctText(it))}</b><div class="why">${esc(it.why)}</div>${pron}`;
  const sb = document.getElementById('say');
  if(sb) sb.onclick = ()=>{ if(!speak(it.say||it.a[0])) sb.textContent='Audio no disponible'; };
  const n = document.getElementById('next'); n.style.display='inline-block'; n.focus();
}

function next(){ idx++; if(idx<quiz.length) render(); else summary(); }

function summary(){
  const total = results.filter(r=>r.ok).length, n = results.length;
  const byCat = {}; Object.keys(week.cats).forEach(c=>byCat[c]={ok:0,n:0});
  results.forEach(r=>{ byCat[r.it.cat].n++; if(r.ok) byCat[r.it.cat].ok++; });
  const wrong = results.filter(r=>!r.ok);
  const p = total/n;
  const msg = p>=.9?'¡Excelente! 🎉': p>=.7?'¡Muy bien! Repasa los errores 👍': p>=.5?'Vas bien, sigue practicando 💪':`Repasa la ${week.title} y vuelve a intentarlo 📚`;
  app.innerHTML = `
    <div class="card">
      <div class="crumb"><button class="link" id="back">← Semanas</button><span class="hint" style="margin:0">/ ${esc(week.title)}</span></div>
      <p class="center hint" style="margin:0">Tu resultado</p>
      <div class="score">${total} / ${n}</div>
      <p class="center" style="margin:4px 0 0">${msg}</p>
      <div class="cats">
        ${Object.keys(week.cats).filter(c=>byCat[c].n).map(c=>`<div class="cat"><strong>${byCat[c].ok}/${byCat[c].n}</strong>${esc(week.cats[c])}</div>`).join('')}
      </div>
      ${wrong.length? `<div class="review"><h3>Para repasar</h3>
        ${wrong.map(r=>{ const it=r.it;
          const prompt = it.type==='listen' ? spellApprox(it.word) : plain(it.big||it.q);
          return `<div class="rv"><div><b>${esc(prompt)}</b> — ${esc(it.q)}</div>
            <div>Tu respuesta: <span class="yours">${esc(r.given)}</span> · Correcta: <span class="right">${esc(correctText(it))}</span></div></div>`;
        }).join('')}</div>` : '<p class="center hint">¡Sin errores! 🙌</p>'}
      <div class="row" style="justify-content:center">
        ${wrong.length?'<button class="btn" id="retry">Repetir solo los errores</button>':''}
        <button class="btn ghost" id="again">Elegir temas</button>
      </div>
    </div>`;
  document.getElementById('back').onclick = home;
  document.getElementById('again').onclick = topics;
  const rt = document.getElementById('retry');
  if(rt) rt.onclick = ()=>{ quiz = shuffle(wrong.map(r=>r.it)); idx=0; results=[]; render(); };
}

try{ if('speechSynthesis' in window) speechSynthesis.getVoices(); }catch(e){}
home();
</script>
</body>
</html>
